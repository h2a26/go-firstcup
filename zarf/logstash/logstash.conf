input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Use the application's "time" field as the @timestamp
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
    remove_field => ["time"]
  }

  mutate {
    # Remove deprecated and unnecessary field
    remove_field => ["type"]

    # Optional: normalize service name (lowercase)
    lowercase => ["service"]
  }
}

output {
  # 1️⃣ Print all logs to stdout for debugging
  stdout {
    codec => rubydebug { metadata => true }
  }

  # 2️⃣ Send to Elasticsearch for storage and analysis
  elasticsearch {
    hosts => ["elasticsearch:9200"]

    # Index pattern: one per service per day
    index => "%{[service]}-%{+YYYY.MM.dd}"

    # Automatically manage connection retry and health check
    ilm_enabled => false
  }
}
